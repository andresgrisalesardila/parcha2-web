<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Te invitaron a un parche en Parcha2</title>
  <meta name="description" content="Abre Parcha2 para aceptar tu invitación al parche." />
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7ff; color: #21162f; }
    main { width: min(92vw, 440px); background: white; border-radius: 28px; padding: 30px 24px; box-shadow: 0 18px 60px rgba(109,34,232,.16); text-align: center; }
    .logo { width: 82px; height: 82px; border-radius: 24px; margin: 0 auto 18px; display: grid; place-items: center; background: linear-gradient(135deg, #6D22E8, #EA4CFF); color: white; font-size: 34px; font-weight: 900; }
    h1 { font-size: 30px; line-height: 1.08; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.45; margin: 0 0 22px; color: #655a73; }
    a, button { width: 100%; border: 0; border-radius: 18px; padding: 16px 18px; font-weight: 800; font-size: 16px; cursor: pointer; box-sizing: border-box; text-decoration: none; display: block; }
    .primary { background: #6D22E8; color: white; }
    .secondary { margin-top: 12px; background: #f3edff; color: #4b1bb0; }
    small { display: block; margin-top: 18px; color: #948aa1; line-height: 1.35; }
  </style>
</head>
<body>
  <main>
    <div class="logo">2</div>
    <h1>Te invitaron a un parche en Parcha2 🎉</h1>
    <p>Abre la app para ver el plan y aceptar la invitación.</p>
    <button class="primary" id="openApp">Abrir en Parcha2</button>
    <a class="secondary" href="/">Conocer Parcha2</a>
    <small>Si la app no abre, instala Parcha2 desde la tienda y vuelve a tocar el link de invitación.</small>
  </main>
  <script>
    function getParcheIdFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('parche');
      return idx >= 0 ? parts[idx + 1] : null;
    }
    function buildAppLink() {
      const parcheId = getParcheIdFromPath();
      const query = window.location.search || '';
      return parcheId ? `parcha2://parche/${encodeURIComponent(parcheId)}${query}` : 'parcha2://';
    }
    function openApp() {
      window.location.href = buildAppLink();
    }
    document.getElementById('openApp').addEventListener('click', openApp);
    setTimeout(openApp, 450);
  </script>
</body>
</html>
