<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Te invitaron a un parche en Parcha2</title>
  <meta name="description" content="Abre Parcha2 para ver el plan y aceptar tu invitación al parche." />
  <meta name="theme-color" content="#6D22E8" />
  <style>
    :root {
      color-scheme: light;
      --ink: #201333;
      --muted: #71647f;
      --purple: #6D22E8;
      --purple-dark: #3d0fb1;
      --pink: #ff0fb7;
      --soft: #f8f2ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(109, 34, 232, .18), transparent 30%),
        radial-gradient(circle at 88% 84%, rgba(255, 15, 183, .16), transparent 34%),
        linear-gradient(135deg, #fffaff 0%, #f7f0ff 48%, #fff7fc 100%);
      padding: 28px;
    }

    .bg-two {
      position: fixed;
      inset: auto auto -16vh -8vw;
      width: min(52vw, 620px);
      opacity: .055;
      transform: rotate(-10deg);
      pointer-events: none;
      filter: blur(.2px);
    }

    .orb {
      position: fixed;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(1px);
    }

    .orb.one {
      width: 380px;
      height: 380px;
      right: -120px;
      bottom: -80px;
      background: linear-gradient(135deg, rgba(109,34,232,.10), rgba(255,15,183,.18));
    }

    .orb.two {
      width: 280px;
      height: 280px;
      left: -90px;
      top: -90px;
      background: rgba(109,34,232,.08);
    }

    .dots {
      position: fixed;
      right: 9vw;
      top: 10vh;
      width: 96px;
      height: 96px;
      opacity: .32;
      background-image: radial-gradient(#9b6cff 2px, transparent 2px);
      background-size: 18px 18px;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      width: min(94vw, 560px);
      padding: 40px 38px 34px;
      text-align: center;
      border: 1px solid rgba(109,34,232,.10);
      border-radius: 36px;
      background: rgba(255, 255, 255, .86);
      box-shadow:
        0 30px 90px rgba(109,34,232,.16),
        0 8px 24px rgba(32,19,51,.05),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
    }

    .brand-mark {
      width: 124px;
      height: 124px;
      object-fit: contain;
      display: block;
      margin: 0 auto 14px;
      filter: drop-shadow(0 18px 32px rgba(255,15,183,.20));
    }

    .sparkles {
      position: absolute;
      inset: 30px 0 auto;
      height: 90px;
      pointer-events: none;
    }

    .sparkles span {
      position: absolute;
      color: var(--pink);
      font-weight: 900;
      opacity: .78;
    }

    .sparkles span:nth-child(1) { left: 27%; top: 28px; color: var(--purple); font-size: 20px; }
    .sparkles span:nth-child(2) { right: 24%; top: 42px; font-size: 22px; }
    .sparkles span:nth-child(3) { right: 33%; top: 10px; color: #a46cff; font-size: 12px; }

    h1 {
      margin: 0 auto 12px;
      max-width: 460px;
      font-size: clamp(32px, 5vw, 46px);
      line-height: 1.04;
      letter-spacing: -.045em;
      font-weight: 950;
    }

    .brand-word {
      color: var(--purple);
      white-space: nowrap;
    }

    p {
      margin: 0 auto 26px;
      max-width: 410px;
      font-size: 17px;
      line-height: 1.5;
      color: var(--muted);
    }

    .actions {
      display: grid;
      gap: 13px;
      margin-top: 4px;
    }

    a, button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 19px;
      padding: 17px 20px;
      font: inherit;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    a:active, button:active { transform: translateY(1px) scale(.99); }

    .primary {
      color: white;
      background: linear-gradient(135deg, var(--purple) 0%, #4b10d4 48%, var(--pink) 140%);
      box-shadow: 0 16px 32px rgba(109,34,232,.28);
    }

    .primary:hover { box-shadow: 0 20px 38px rgba(109,34,232,.34); }

    .secondary {
      color: var(--purple-dark);
      background: rgba(109,34,232,.07);
      border: 1px solid rgba(109,34,232,.12);
    }

    .icon-pill {
      display: inline-grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 11px;
      background: rgba(255,255,255,.16);
      margin-right: auto;
      flex: 0 0 auto;
    }

    .secondary .icon-pill { background: white; color: var(--purple); }

    .label { flex: 1; text-align: center; }
    .arrow { margin-left: auto; opacity: .85; font-size: 24px; line-height: 1; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0 14px;
      color: var(--pink);
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(109,34,232,.14), transparent);
    }

    small {
      display: block;
      max-width: 390px;
      margin: 0 auto;
      color: #8f829c;
      font-size: 14px;
      line-height: 1.45;
    }

    @media (max-width: 520px) {
      body { padding: 18px; overflow: auto; }
      main { padding: 32px 22px 28px; border-radius: 30px; }
      .brand-mark { width: 108px; height: 108px; }
      a, button { min-height: 56px; font-size: 16px; }
      .dots { display: none; }
    }
  </style>
</head>
<body>
  <img class="bg-two" src="/logo-2.png" alt="" aria-hidden="true" />
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <div class="dots" aria-hidden="true"></div>

  <main>
    <div class="sparkles" aria-hidden="true"><span>✦</span><span>✦</span><span>•</span></div>
    <img class="brand-mark" src="/logo-2.png" alt="Parcha2" />
    <h1>Te invitaron a un parche en <span class="brand-word">Parcha2</span> ✨</h1>
    <p>Abre la app para ver el plan y aceptar la invitación.</p>

    <div class="actions">
      <button class="primary" id="openApp" type="button">
        <span class="icon-pill">↗</span>
        <span class="label">Abrir en Parcha2</span>
        <span class="arrow">›</span>
      </button>
      <a class="secondary" href="/">
        <span class="icon-pill">?</span>
        <span class="label">Conocer Parcha2</span>
        <span class="arrow">›</span>
      </a>
    </div>

    <div class="divider" aria-hidden="true">♥</div>
    <small>Si la app no abre, instala Parcha2 y vuelve a tocar el link de invitación.</small>
  </main>

  <script>
    function getParcheIdFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('parche');
      return idx >= 0 ? parts[idx + 1] : null;
    }

    function buildAppLink() {
      const parcheId = getParcheIdFromPath();
      const query = window.location.search || '';
      return parcheId ? `parcha2://parche/${encodeURIComponent(parcheId)}${query}` : 'parcha2://';
    }

    function openApp() {
      window.location.href = buildAppLink();
    }

    document.getElementById('openApp').addEventListener('click', openApp);
    setTimeout(openApp, 650);
  </script>
</body>
</html>
